[workspace]
members = [
    "crates/elap-core",
    "crates/elap-desktop",
    "crates/elap-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BBLABS <info@bblabs.io>"]
license = "Proprietary"
repository = "https://github.com/bblabs/elap"
homepage = "https://bblabs.io/elap"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7" }

# gRPC
tonic = { version = "0.10" }
tonic-build = { version = "0.10" }
prost = { version = "0.12" }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = { version = "0.2" }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
toml = { version = "0.8" }

# Error handling
anyhow = { version = "1.0" }
thiserror = { version = "1.0" }

# Crypto
ring = { version = "0.17" }
aes-gcm = { version = "0.10" }
hex = { version = "0.4" }

# Testing
criterion = { version = "0.5" }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 2
