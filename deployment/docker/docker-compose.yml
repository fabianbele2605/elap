version: '3.9'

services:
  # ELAP Core API
  core:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.core
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://elap:elap@postgres:5432/elap
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - elap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python AI Runtime
  ai-runtime:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.python
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - core
    networks:
      - elap-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elap
      POSTGRES_PASSWORD: elap
      POSTGRES_DB: elap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - elap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - elap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (Optional - for local models)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - elap-network
    profiles:
      - with-ollama

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

networks:
  elap-network:
    driver: bridge
