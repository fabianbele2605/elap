apiVersion: apps/v1
kind: Deployment
metadata:
  name: elap-core
  labels:
    app: elap
    component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elap
      component: core
  template:
    metadata:
      labels:
        app: elap
        component: core
    spec:
      containers:
      - name: elap-core
        image: elap:core-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 50051
          name: grpc
        env:
        - name: RUST_LOG
          value: "info"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: elap-secrets
              key: database-url
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: elap-core
  labels:
    app: elap
    component: core
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  - port: 50051
    targetPort: 50051
    name: grpc
  selector:
    app: elap
    component: core
