apiVersion: v1
kind: Secret
metadata:
  name: elap-secrets
type: Opaque
stringData:
  database-url: "postgresql://elap:elap@postgres:5432/elap"
  qdrant-url: "http://qdrant:6333"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: elap
    component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: elap
      component: postgres
  template:
    metadata:
      labels:
        app: elap
        component: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: elap
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elap-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: elap
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: elap
    component: postgres
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: elap
    component: postgres
