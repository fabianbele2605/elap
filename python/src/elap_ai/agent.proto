syntax = "proto3";

package elap.agent;

// Solicitud para ejecutar un agente
message ExecuteAgentRequest {
    string agent_id = 1;
    string query = 2;
}

// Respuesta de ejecución del agente
message ExecuteAgentResponse {
    string agent_id = 1;
    string status = 2;     // "running", "completed", "error"
    string result = 3;     // Resultado de la ejecución
    float progress = 4;    // 0.0 a 1.0
    string error = 5;      // Mensaje de error si aplica
}

// Solicitud de health check
message HealthCheckRequest {
    string service = 1;
}

// Respuesta de health check
message HealthCheckResponse {
    string status = 1;     // "ok", "error"
    string message = 2;
}

// Chunk de respuesta en streaming
message ExecuteAgentChunk {
    string agent_id = 1;
    string chunk = 2;      // Token o fragmento de respuesta
    float progress = 3;    // 0.0 a 1.0
    bool is_final = 4;     // True si es el último chunk
    string error = 5;      // Mensaje de error si aplica
}

// === NUEVOS MENSAJES PARA FASE 2 ===

// Solicitud de búsqueda en documentos
message SearchDocumentsRequest {
    string collection = 1;    // Nombre de colección
    string query = 2;         // Texto de búsqueda
    int32 top_k = 3;          // Número de resultados
}

// Respuesta de búsqueda
message SearchDocumentsResponse {
    string status = 1;        // "success" o "error"
    repeated string chunks = 2;  // Fragmentos recuperados
    int32 count = 3;          // Cantidad de resultados
    string error = 4;         // Mensaje de error
}

// Solicitud de generación de reporte
message GenerateReportRequest {
    string title = 1;         // Título del reporte
    string sections_json = 2; // JSON con secciones {title, content, data}
    string format = 3;        // "pdf" o "excel"
    string company_name = 4;  // Nombre de empresa para header
}

// Respuesta de generación de reporte
message GenerateReportResponse {
    string status = 1;        // "success" o "error"
    bytes file_bytes = 2;     // Contenido del archivo
    string filename = 3;      // Nombre del archivo generado
    string error = 4;         // Mensaje de error
}

// Solicitud de ejecución con RAG
message ExecuteAgentWithRAGRequest {
    string agent_id = 1;
    string query = 2;
    string rag_collection = 3;  // Colección para buscar contexto
}

// Respuesta de ejecución con RAG
message ExecuteAgentWithRAGResponse {
    string agent_id = 1;
    string status = 2;        // "completed" o "error"
    string result = 3;        // Respuesta del agente
    repeated string context_chunks = 4;  // Chunks de contexto recuperados
    int32 context_count = 5;  // Cantidad de chunks
    string error = 6;         // Mensaje de error
}

// === NUEVOS MENSAJES PARA FASE 3 ===

// Configuración de empresa para generación de documentos
message CompanyConfig {
    string nombreEmpresa = 1;
    string sector = 2;
    string ubicacion = 3;
    int32 anoFundacion = 4;
    string website = 5;
    int32 numEmpleados = 6;
    repeated string departamentos = 7;
    string ceo = 8;
    string contactoRRHH = 9;
    repeated string productos = 10;
    repeated string servicios = 11;
    string clientesPrincipales = 12;
    int32 salarioPromedio = 13;
    int32 presupuestoAnual = 14;
    string crecimientoEsperado = 15;
}

// Solicitud de generación de documentos
message GenerateDocumentsRequest {
    CompanyConfig config = 1;
    repeated string template_names = 2;  // Si vacío, genera todos los 15
}

// Documento generado
message GeneratedDocument {
    string id = 1;
    string title = 2;
    string template_name = 3;
    string status = 4;         // "generating", "ready", "error"
    int32 progress = 5;        // 0-100
    bytes content = 6;         // Contenido del documento
    string error = 7;          // Mensaje de error si aplica
    string indexed_in_rag = 8; // "yes", "no", "pending"
}

// Respuesta de generación de documentos
message GenerateDocumentsResponse {
    string company_id = 1;
    string status = 2;         // "completed", "error", "partial"
    repeated GeneratedDocument documents = 3;
    int32 total_documents = 4;
    string rag_collection_name = 5;
    int32 documents_indexed = 6;
    string error = 7;
}

// Solicitud de estado de generación
message GetGenerationStatusRequest {
    string company_id = 1;
}

// Respuesta de estado
message GetGenerationStatusResponse {
    string company_id = 1;
    string overall_status = 2;  // "completed", "generating", "error"
    repeated GeneratedDocument documents = 3;
    int32 total_documents = 4;
    int32 completed_documents = 5;
    int32 documents_indexed = 6;
    float progress_percentage = 7;
    string error = 8;
}

// Servicio principal del AI Runtime
service AIRuntimeService {
    // Ejecutar un agente (respuesta completa)
    rpc ExecuteAgent(ExecuteAgentRequest) returns (ExecuteAgentResponse);

    // Ejecutar un agente con streaming (tokens en vivo)
    rpc ExecuteAgentStreaming(ExecuteAgentRequest) returns (stream ExecuteAgentChunk);

    // Health check
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // === NUEVOS RPC PARA FASE 2 ===

    // Buscar documentos en RAG
    rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);

    // Generar reporte (PDF/Excel)
    rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);

    // Ejecutar agente con contexto RAG
    rpc ExecuteAgentWithRAG(ExecuteAgentWithRAGRequest) returns (ExecuteAgentWithRAGResponse);

    // === NUEVOS RPC PARA FASE 3 ===

    // Generar 15 documentos personalizados
    rpc GenerateDocuments(GenerateDocumentsRequest) returns (GenerateDocumentsResponse);

    // Obtener estado de generación
    rpc GetGenerationStatus(GetGenerationStatusRequest) returns (GetGenerationStatusResponse);
}
